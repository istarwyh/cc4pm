repository: https://github.com/istarwyh/cc4pm
branch: main
productionURL: https://istarwyh.github.io/cc4pm/
courses:
  - id: product
    title: 产品主理人课程
    guide: guide
    module: cc4pm-guide
    intro: 从 Claude Code 基础，到创意、产品、设计、工程与完整项目实战。
    color: '#a54f36'
  - id: lawyer
    title: cc4Lawyer 行业工作台课程
    guide: verticals/lawyer/guide
