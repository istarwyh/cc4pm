    overview: verticals/lawyer/README.md
    color: '#657448'
    materials:
      - {id: case, title: 模拟案例材料, directory: verticals/lawyer/examples/saas-contract-dispute, exclude: [expected-outputs]}
      - {id: templates, title: 工作台模板, directory: verticals/lawyer/templates}
      - {id: outputs, title: 参考交付件, directory: verticals/lawyer/examples/saas-contract-dispute/expected-outputs}
