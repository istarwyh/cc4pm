name: Validate or publish @cc4pm/homepage

on:
  push:
    branches: [main]
    paths:
      - packages/homepage/**
      - docs/index.html
      - guide/course-map.yaml
      - verticals/lawyer/guide/course-map.yaml
      - website/site.yaml
      - website/scripts/content.mjs
      - website/scripts/homepage.mjs
      - website/scripts/check-published-homepage.mjs
      - .github/workflows/publish-homepage.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Force notify downstream even without version bump"
        type: boolean
        default: false

jobs:
  publish:
    name: Validate homepage and publish on manual dispatch
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci --ignore-scripts
      - name: Verify generated standalone homepage
        run: npm run check:homepage

      - name: Check if version already published
        id: check
        working-directory: packages/homepage
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@cc4pm/homepage@$PKG_VERSION" version 2>/dev/null; then
            npm pack "@cc4pm/homepage@$PKG_VERSION" --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/homepage-pack.json"
            node ../../website/scripts/check-published-homepage.mjs "$RUNNER_TEMP/homepage-pack.json"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: github.event_name == 'workflow_dispatch' && steps.check.outputs.already_published == 'false'
        working-directory: packages/homepage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.check.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Skip (already published)
        if: steps.check.outputs.already_published == 'true'
        run: |
          echo "::notice::@cc4pm/homepage@${{ steps.check.outputs.version }} already on npm, skipping publish."
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.check.outputs.version }}" >> "$GITHUB_OUTPUT"

  notify-downstream:
    name: Notify ai-speeds to upgrade
    needs: publish
    if: github.event_name == 'workflow_dispatch' && (needs.publish.outputs.published == 'true' || inputs.force_notify == true)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to istarwyh/ai-speeds
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: istarwyh/ai-speeds
          event-type: cc4pm-homepage-released
          client-payload: |
            {
              "version": "${{ needs.publish.outputs.version }}",
              "package": "@cc4pm/homepage",
              "triggered_by": "${{ github.actor }}",
              "source_sha": "${{ github.sha }}"
            }
