name: Publish cc4pm to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact main package version to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cc4pm-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'if (process.env.RELEASE_VERSION !== require("./package.json").version) throw new Error("Requested version does not match main");'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:homepage
      - name: Check version availability
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm view cc4pm versions --json > "$RUNNER_TEMP/cc4pm-versions.json"
          node -e 'const fs = require("node:fs"); const versions = JSON.parse(fs.readFileSync(process.argv[1])); if (versions.includes(process.env.RELEASE_VERSION)) throw new Error("Version already published");' "$RUNNER_TEMP/cc4pm-versions.json"
      - name: Pack verified sources
        run: npm pack --ignore-scripts --json > "$RUNNER_TEMP/cc4pm-pack.json"
      - name: Publish verified package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_FILE=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1]))[0].filename)' "$RUNNER_TEMP/cc4pm-pack.json")
          npm publish "./$PACKAGE_FILE" --access public --tag latest --ignore-scripts
      - name: Verify registry version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm view "cc4pm@$RELEASE_VERSION" version dist.integrity
