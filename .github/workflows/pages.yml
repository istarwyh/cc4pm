name: Build and deploy official documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: 'off'
  HUGO_MODULE_WORKSPACE: 'off'

jobs:
  build:
    name: cc4pm-site-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      node: ${{ steps.toolchain.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: toolchain
        uses: ./.github/actions/site-toolchain
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        id: pages
      - name: Tests, browser journeys and production build
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$SITE_BASE_URL" ]; then
            npm run site:check -- --baseURL "${SITE_BASE_URL%/}/"
          else
            npm run site:check
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-browser-failure
          path: |
            website/test-results
            website/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site-bundle
          path: website/public
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build.outputs.node }}
      - uses: actions/download-artifact@v4
        with:
          name: site-bundle
          path: website/public
      - run: node website/scripts/release.mjs website/public "$GITHUB_SHA" --clean
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed revision, every file hash and 404
        run: node website/scripts/verify-live.mjs --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-live-verification
          path: website/test-results/live.json
          retention-days: 30
