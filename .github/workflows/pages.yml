name: Build and deploy official documentation

on:
  push:
    branches: [main]
    paths: &site-paths
      - guide/**
      - verticals/lawyer/**
      - website/**
      - docs/index.html
      - package.json
      - package-lock.json
      - manifests/**
      - packages/homepage/**
      - scripts/sync-courseware.js
      - .claude/skills/cc4pm-guide/SKILL.md
      - .github/workflows/pages.yml
  pull_request:
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.165.0'
  GOWORK: 'off'
  HUGO_MODULE_WORKSPACE: 'off'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum
      - name: Install pinned Hugo extended
        run: |
          ASSET="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          RELEASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --retry 3 "$RELEASE/$ASSET" -o "$ASSET"
          curl --fail --location --retry 3 "$RELEASE/hugo_${HUGO_VERSION}_checksums.txt" -o checksums.txt
          awk -v asset="$ASSET" '$2 == asset { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          sudo dpkg -i "$ASSET"
          hugo version
      - run: npm test
      - run: npm run test:site
      - run: npm run check:homepage
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        id: pages
      - name: Build and validate all published pages
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://istarwyh.github.io/cc4pm' }}
        run: npm run build:site -- --baseURL "${SITE_BASE_URL%/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
